[project]
name = "adaptive-swimming-platform"
version = "0.1.0"
description = "Deterministic adaptive swimming workout engine and analytics platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Andres Lozano" }
]
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.12,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_swimming"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
